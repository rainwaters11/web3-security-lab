name: Project checks

on:
  push:
    branches: [main, 'copilot/**', 'codex/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Runtime and source
        run: |
          node --version
          git rev-parse HEAD
      # No package installation needed: current app uses Node built-ins only.
      - name: Run application and model tests
        run: npm test

  foundry:
    name: Solidity scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
          cache: false
      - name: Record toolchain and configuration
        working-directory: foundry
        run: |
          forge --version
          git rev-parse HEAD
          forge config
      - name: Run local Solidity exercises with traces
        working-directory: foundry
        run: forge test -vvvv
